# Netlify deployment configuration.
#
# Environment variables are NOT read from .env (it is gitignored, and correctly
# so). Set them in: Site configuration -> Environment variables
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
# Anything prefixed VITE_ is inlined into the client bundle at build time, so a
# change to them requires a fresh deploy, not just a restart.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback — mirrors public/_redirects so the routing works whichever
# mechanism Netlify picks up first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the fingerprinted assets; never cache the HTML entry point.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
